name: AI Assistant Checks

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "studio/app/editor/**"
      - "studio/app/views/ai_chat_view.py"
      - "studio/app/vxpui/main_window.py"
      - "studio/app/ui/theme.py"
      - "studio/app/services/ai_*.py"
      - "tools/validate_ai_*.py"
      - "tools/studio_theme_check.py"
      - "requirements-studio.txt"
      - ".github/workflows/ai-assistant-check.yml"
  workflow_dispatch:

jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q studio tools

      - name: Validate AI assistant UI and editor tabs
        run: python tools/validate_ai_assistant_ui_refresh.py

      - name: Validate AI Workbench wiring
        run: python tools/validate_ai_workbench_v1.py

      - name: Validate Full Access and Hard Stop
        run: python tools/validate_ai_full_access_stop.py


  windows-theme-render:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Studio dependencies
        run: python -m pip install -r requirements-studio.txt

      - name: Compile Python sources
        run: python -m compileall -q studio tools

      - name: Render-check Studio theme and AI file badges
        run: python -u tools/studio_theme_check.py --shots build/theme-shots

      - name: Commit rendered screenshots
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          Copy-Item build/theme-shots/*.png screenshots/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No screenshot changes to commit."
          } else {
            git commit -m "docs(screenshots): update Windows UI render captures"
            git push origin "HEAD:${{ github.head_ref }}"
          }

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-theme-shots-windows
          path: build/theme-shots
          if-no-files-found: ignore
